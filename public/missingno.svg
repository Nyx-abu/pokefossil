<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Background border -->
  <rect x="0" y="0" width="48" height="48" fill="#14121c" rx="4"/>
  <!-- Glitch static frame -->
  <rect x="2" y="2" width="44" height="44" fill="#201b2f" rx="3"/>
  
  <!-- Left glitch bar (barcode-style noise) -->
  <rect x="6" y="6" width="4" height="6" fill="#8c7bc4"/>
  <rect x="6" y="14" width="4" height="4" fill="#e056fd"/>
  <rect x="6" y="20" width="4" height="8" fill="#2b2638"/>
  <rect x="6" y="30" width="4" height="4" fill="#ffffff"/>
  <rect x="6" y="36" width="4" height="6" fill="#686de0"/>

  <rect x="10" y="8" width="4" height="4" fill="#38a3a5"/>
  <rect x="10" y="16" width="4" height="8" fill="#8c7bc4"/>
  <rect x="10" y="26" width="4" height="4" fill="#e09f3e"/>
  <rect x="10" y="32" width="4" height="6" fill="#2b2638"/>

  <!-- Center-Right Pixel Question Mark -->
  <rect x="20" y="10" width="14" height="4" fill="#ffffff"/>
  <rect x="18" y="12" width="4" height="6" fill="#ffffff"/>
  <rect x="32" y="12" width="4" height="8" fill="#ffffff"/>
  <rect x="28" y="18" width="4" height="6" fill="#ffffff"/>
  <rect x="24" y="22" width="4" height="6" fill="#ffffff"/>
  <rect x="24" y="32" width="4" height="4" fill="#ffffff"/>

  <!-- Glitch chromatic aberration shadows -->
  <rect x="16" y="14" width="2" height="4" fill="#ff0055" opacity="0.8"/>
  <rect x="36" y="12" width="2" height="8" fill="#00ffff" opacity="0.8"/>
  <rect x="22" y="22" width="2" height="6" fill="#ff0055" opacity="0.8"/>
  <rect x="28" y="22" width="2" height="6" fill="#00ffff" opacity="0.8"/>
  <rect x="22" y="32" width="2" height="4" fill="#ff0055" opacity="0.8"/>
  <rect x="28" y="32" width="2" height="4" fill="#00ffff" opacity="0.8"/>

  <!-- Right side glitch noise blocks -->
  <rect x="38" y="6" width="4" height="8" fill="#8c7bc4"/>
  <rect x="38" y="16" width="4" height="4" fill="#ffffff"/>
  <rect x="38" y="22" width="4" height="8" fill="#e056fd"/>
  <rect x="38" y="32" width="4" height="6" fill="#38a3a5"/>

  <!-- Bottom glitch data blocks -->
  <rect x="14" y="40" width="6" height="2" fill="#8c7bc4"/>
  <rect x="22" y="40" width="8" height="2" fill="#00ffff"/>
  <rect x="32" y="40" width="6" height="2" fill="#ff0055"/>
</svg>
